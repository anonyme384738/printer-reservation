
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bambu Print Scheduler</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #ffffff; --bg-secondary: #f5f5f4; --bg-info: #e6f1fb;
      --bg-success: #eaf3de; --bg-warning: #faeeda; --bg-danger: #fcebeb;
      --text: #1a1a1a; --text-secondary: #6b7280; --text-tertiary: #9ca3af;
      --text-info: #185fa5; --text-success: #3b6d11; --text-warning: #854f0b; --text-danger: #a32d2d;
      --border: rgba(0,0,0,0.12); --border-secondary: rgba(0,0,0,0.2); --border-info: #378add;
      --radius: 8px; --radius-lg: 12px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1c1e; --bg-secondary: #2c2c2e; --bg-info: #0c447c;
        --bg-success: #27500a; --bg-warning: #633806; --bg-danger: #791f1f;
        --text: #f2f2f7; --text-secondary: #aeaeb2; --text-tertiary: #636366;
        --text-info: #85b7eb; --text-success: #c0dd97; --text-warning: #fac775; --text-danger: #f09595;
        --border: rgba(255,255,255,0.1); --border-secondary: rgba(255,255,255,0.2); --border-info: #378add;
      }
    }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg-secondary); color: var(--text); min-height: 100vh; padding: 2rem 1rem; }
    .container { max-width: 980px; margin: 0 auto; }
    .header { margin-bottom: 2rem; }
    .header h1 { font-size: 22px; font-weight: 600; color: var(--text); display: flex; align-items: center; gap: 8px; }
    .header p { font-size: 14px; color: var(--text-secondary); margin-top: 4px; }

    .webhook-bar { background: var(--bg); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 10px 14px; display: flex; align-items: center; gap: 10px; margin-bottom: 2rem; }
    .webhook-bar input { flex: 1; font-size: 12px; border: none; background: transparent; color: var(--text); font-family: monospace; outline: none; }
    .webhook-bar input::placeholder { color: var(--text-tertiary); font-family: inherit; }
    .webhook-status { font-size: 11px; white-space: nowrap; padding: 3px 10px; border-radius: 20px; }
    .ws-none { background: var(--bg-secondary); color: var(--text-tertiary); border: 0.5px solid var(--border); }
    .ws-set { background: var(--bg-success); color: var(--text-success); }
    .btn-test { font-size: 12px; padding: 4px 12px; border-radius: var(--radius); border: 0.5px solid var(--border-secondary); background: transparent; color: var(--text-secondary); cursor: pointer; }
    .btn-test:hover { color: var(--text); border-color: var(--text); }

    .printers-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 2rem; }
    .printer-card { background: var(--bg-secondary); border: 1px solid var(--border-secondary); border-radius: var(--radius-lg); padding: 16px; cursor: pointer; transition: border-color 0.15s, background 0.15s; position: relative; text-align: center; }
    .printer-card:hover { border-color: var(--border-info); }
    .printer-card.selected { border: 2px solid var(--border-info) !important; }
    .printer-name { font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 2px; }
    .printer-model { font-size: 12px; color: var(--text-secondary); margin-bottom: 12px; }
    .status-row { display: flex; align-items: center; gap: 6px; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; }
    .status-free .status-dot { background: #63c15d; }
    .status-busy .status-dot { background: #e24b4a; }
    .status-reserved .status-dot { background: #ef9f27; }
    .status-label { font-size: 12px; color: var(--text-secondary); }
    .reservations-mini { margin-top: 10px; border-top: 0.5px solid var(--border); padding-top: 8px; }
    .res-item-mini { font-size: 11px; color: var(--text-secondary); padding: 2px 0; display: flex; align-items: center; gap: 5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .res-dot-mini { width: 5px; height: 5px; border-radius: 50%; background: #ef9f27; flex-shrink: 0; }
    .check-badge { position: absolute; top: 10px; right: 10px; color: var(--text-info); display: none; }
    .printer-card.selected .check-badge { display: block; }

    .card { background: var(--bg); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 1.5rem 2rem 2rem; margin-bottom: 1.5rem; }
    .card h2 { font-size: 18px; font-weight: 700; color: var(--text); margin-bottom: 1.75rem; }
    .f-section { margin-bottom: 28px; }
    .f-label { font-size: 14px; font-weight: 600; color: var(--text-secondary); margin-bottom: 10px; display: block; }
    .field input[type=text] { font-size: 14px; padding: 9px 13px; border: 1px solid var(--border-secondary); border-radius: var(--radius); background: var(--bg-secondary); color: var(--text); font-family: inherit; width: 240px; }
    .field input[type=text]:focus { outline: none; border-color: var(--border-info); box-shadow: 0 0 0 3px rgba(55,138,221,0.12); }
    .field textarea { width: 100%; font-size: 14px; padding: 10px 13px; border: 1px solid var(--border-secondary); border-radius: var(--radius); background: var(--bg-secondary); color: var(--text); font-family: inherit; resize: vertical; min-height: 90px; }
    .field textarea:focus { outline: none; border-color: var(--border-info); box-shadow: 0 0 0 3px rgba(55,138,221,0.12); }

    /* Day picker */
    .day-row { display: flex; gap: 10px; }
    .day-btn { width: 120px; padding: 14px 8px; border-radius: var(--radius-lg); border: 1px solid var(--border-secondary); background: var(--bg-secondary); color: var(--text-secondary); cursor: pointer; font-family: inherit; text-align: center; transition: border-color 0.15s; }
    .day-btn .day-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; }
    .day-btn .day-date { font-size: 28px; font-weight: 700; line-height: 1.2; margin-top: 4px; color: var(--text); }
    .day-btn:hover { border-color: var(--border-info); }
    .day-btn.active { background: var(--bg-info); border-color: var(--border-info); }
    .day-btn.active .day-label { color: var(--text-info); }
    .day-btn.active .day-date { color: var(--text-info); }

    /* Duration + custom on same row */
    .dur-custom-row { display: flex; align-items: flex-end; gap: 32px; }
    .dur-section { flex: 1; }
    .custom-section { flex-shrink: 0; }
    .dur-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .dur-btn { font-size: 13px; padding: 6px 14px; border-radius: 20px; border: 1px solid var(--border-secondary); background: var(--bg-secondary); color: var(--text-secondary); cursor: pointer; font-family: inherit; }
    .dur-btn:hover { border-color: var(--border-info); color: var(--text-info); }
    .dur-btn.active { background: var(--bg-info); color: var(--text-info); border-color: var(--border-info); }

    /* Start time row */
    .start-time-row { display: flex; align-items: center; gap: 12px; }
    .start-time-row label { font-size: 14px; font-weight: 600; color: var(--text-secondary); white-space: nowrap; }
    .start-time-row select { font-size: 14px; padding: 8px 12px; border: 1px solid var(--border-secondary); border-radius: var(--radius); background: var(--bg-secondary); color: var(--text); font-family: inherit; }
    .start-time-row select:focus { outline: none; border-color: var(--border-info); }

    .conflict-msg { font-size: 13px; color: var(--text-danger); margin-top: 10px; display: none; align-items: center; gap: 6px; }
    .conflict-msg.show { display: flex; }
    .btn-submit { width: 100%; padding: 13px; font-size: 15px; font-weight: 600; border-radius: var(--radius); border: none; cursor: pointer; background: #6b8fa8; color: #fff; margin-top: 4px; font-family: inherit; transition: opacity 0.15s; }
    .btn-submit:hover { opacity: 0.88; }
    .btn-submit:disabled { opacity: 0.4; cursor: not-allowed; }
    .cal-confirm { display: none; margin-top: 16px; background: var(--bg-success); border: 1px solid var(--text-success); border-radius: var(--radius-lg); padding: 14px 16px; }
    .cal-confirm.show { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .cal-confirm-text { font-size: 13px; color: var(--text-success); font-weight: 500; }
    .btn-cal { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; padding: 7px 14px; border-radius: var(--radius); border: none; cursor: pointer; background: #0078d4; color: #fff; font-family: inherit; text-decoration: none; }
    .btn-cal:hover { opacity: 0.88; }

    /* Shared */
    .section-label { font-size: 11px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.06em; }

    /* Gantt */
    .gantt-wrap { background: var(--bg); border: 0.5px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; margin-bottom: 12px; }
    .gantt-header { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 0.5px solid var(--border); }
    .gantt-nav-btn { background: var(--bg-secondary); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 4px 12px; cursor: pointer; color: var(--text-secondary); font-size: 13px; font-family: inherit; }
    .gantt-nav-btn:hover { color: var(--text); border-color: var(--border-secondary); }
    .gantt-title { font-size: 14px; font-weight: 600; color: var(--text); }
    .gantt-day-tabs { display: flex; gap: 4px; }
    .gantt-day-tab { font-size: 12px; padding: 4px 10px; border-radius: 20px; border: 0.5px solid var(--border); background: transparent; color: var(--text-secondary); cursor: pointer; font-family: inherit; }
    .gantt-day-tab:hover { color: var(--text); }
    .gantt-day-tab.active { background: var(--bg-info); color: var(--text-info); border-color: var(--border-info); }
    .gantt-body { overflow-x: auto; }
    .gantt-inner { display: flex; flex-direction: column; }
    .gantt-scroll-area { overflow-x: auto; scroll-snap-type: x mandatory; }
    .gantt-scroll-inner { display: inline-flex; flex-direction: column; min-width: 100%; }
    .gantt-time-header { display: flex; margin-left: 130px; border-bottom: 0.5px solid var(--border); }
    .gantt-hour { width: 60px; flex-shrink: 0; font-size: 10px; color: var(--text-tertiary); padding: 4px 0; text-align: center; border-right: 0.5px solid var(--border); user-select: none; }
    .gantt-hour:last-child { border-right: none; }
    .gantt-day-divider { display: flex; margin-left: 130px; border-bottom: 0.5px solid var(--border); background: var(--bg-secondary); }
    .gantt-day-label-cell { width: 60px; flex-shrink: 0; }
    .gantt-day-span { font-size: 11px; font-weight: 600; color: var(--text-info); padding: 3px 8px; border-right: 1.5px solid var(--border-info); white-space: nowrap; }
    .gantt-row { display: flex; align-items: stretch; border-bottom: 0.5px solid var(--border); min-height: 88px; position: relative; }
    .gantt-row:last-child { border-bottom: none; }
    .gantt-row-label { width: 130px; flex-shrink: 0; font-size: 11px; font-weight: 600; color: var(--text); padding: 8px 12px; border-right: 0.5px solid var(--border); line-height: 1.3; position: sticky; left: 0; z-index: 2; display: flex; flex-direction: column; justify-content: center; }
    .gantt-row-label span { display: block; font-size: 10px; font-weight: 400; color: var(--text-secondary); }
    .gantt-row-track { position: relative; height: 88px; flex-shrink: 0; }
    .gantt-row-track.day-sep { border-right: 1.5px solid var(--border-info); }
    .gantt-track-bg { position: absolute; inset: 0; background-image: repeating-linear-gradient(90deg, transparent, transparent 59.5px, var(--border) 59.5px, var(--border) 60px); }
    .gantt-now-line { position: absolute; top: 0; bottom: 0; width: 2px; background: #e24b4a; z-index: 5; pointer-events: none; }
    .gantt-now-line::before { content: ''; position: absolute; top: -3px; left: -3px; width: 8px; height: 8px; border-radius: 50%; background: #e24b4a; }
    .gantt-bar { position: absolute; top: 5px; bottom: 5px; border-radius: 5px; border-left: 3px solid transparent; display: flex; align-items: center; padding: 0 7px; cursor: pointer; overflow: hidden; transition: opacity 0.15s; min-width: 4px; }
    .gantt-bar:hover { opacity: 0.85; }
    .gantt-bar-text { font-size: 11px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .gantt-bar-sub { font-size: 10px; color: var(--text-secondary); white-space: nowrap; margin-left: 4px; }

    /* Tooltip */
    .gantt-tooltip { position: fixed; background: var(--text); color: var(--bg); font-size: 12px; padding: 8px 12px; border-radius: var(--radius); pointer-events: none; z-index: 999; display: none; line-height: 1.6; max-width: 220px; }
    .gantt-tooltip.show { display: block; }

    .color-0 { background: #e8f4fd; border-color: #3b9ede; }
    .color-1 { background: #fef3e2; border-color: #f59e0b; }
    .color-2 { background: #edfaf1; border-color: #34c759; }
    .color-3 { background: #fce8f3; border-color: #d946a8; }
    .color-4 { background: #f0ecfd; border-color: #8b5cf6; }
    @media (prefers-color-scheme: dark) {
      .color-0 { background: #0c3a5c; border-color: #3b9ede; }
      .color-1 { background: #4a3000; border-color: #f59e0b; }
      .color-2 { background: #0a3d1f; border-color: #34c759; }
      .color-3 { background: #4a0a35; border-color: #d946a8; }
      .color-4 { background: #2d1a5c; border-color: #8b5cf6; }
    }

    .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg); font-size: 14px; padding: 10px 20px; border-radius: var(--radius); opacity: 0; pointer-events: none; transition: opacity 0.2s; z-index: 999; white-space: nowrap; font-family: inherit; }
    .toast.show { opacity: 1; }

    /* Scene printer selector */
    .scene-wrap { position: relative; width: 100%; margin-bottom: 1rem; border-radius: var(--radius-lg); overflow: hidden; border: 1px solid var(--border-secondary); background: #111; }
    .scene-img { display: block; width: 100%; height: auto; pointer-events: none; user-select: none; }
    .scene-hotspot { position: absolute; cursor: pointer; border-radius: 6px; transition: outline 0.12s; }
    .scene-hotspot:hover { outline: 3px solid rgba(55,138,221,0.55); }
    .scene-selected-label { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.65); color: #fff; font-size: 12px; font-weight: 600; padding: 4px 14px; border-radius: 20px; pointer-events: none; white-space: nowrap; }
    .printer-status-row { display: flex; gap: 10px; margin-bottom: 1.5rem; }
    .psr-card { flex: 1; background: var(--bg); border: 1px solid var(--border-secondary); border-radius: var(--radius-lg); padding: 10px 14px; cursor: pointer; transition: border-color 0.15s; position: relative; }
    .psr-card.selected { border: 2px solid var(--border-info) !important; }
    .psr-card:hover { border-color: var(--border-info); }
    .psr-name { font-size: 13px; font-weight: 600; color: var(--text); }
    .psr-model { font-size: 11px; color: var(--text-secondary); }
    .psr-status { display: flex; align-items: center; gap: 5px; margin-top: 6px; }
    .psr-dot { width: 7px; height: 7px; border-radius: 50%; }
    .psr-status-label { font-size: 11px; color: var(--text-secondary); }
    .psr-check { position: absolute; top: 8px; right: 8px; color: var(--text-info); display: none; }
    .psr-card.selected .psr-check { display: block; }
  </style>
</head>
<body>
<div class="container">

  <div class="header">
    <h1><i class="ti ti-printer"></i> Bambu Print Scheduler</h1>
    <p>Reserve a 3D printer — notifications post automatically to Teams.</p>
  </div>

  <div id="loading-msg" style="display:none;font-size:13px;color:var(--text-secondary);padding:8px 0 4px;"><i class="ti ti-loader" style="animation:spin 1s linear infinite;display:inline-block;margin-right:4px;"></i> Syncing…</div>
  <div id="sp-error" style="display:none;font-size:13px;color:var(--text-danger);padding:8px 12px;background:var(--bg-danger);border-radius:var(--radius);margin-bottom:1rem;"></div>
  <style>@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}</style>

  <div id="printer-scene-selector">
    <div class="scene-wrap" id="scene-wrap">
      <img id="scene-img" class="scene-img"
           src="images/Base_photo.png"
           data-scene="images/Base_photo.png"
           alt="3D Printers">
      <div class="scene-hotspot" data-printer="x1c-left"
           data-hover="images/User_sees_while_hovering_X1C_Left.png"
           data-select="images/Selected_X1C_Left.png"
           style="left:0%;top:17%;width:25%;height:65%;"></div>
      <div class="scene-hotspot" data-printer="x1c-middle"
           data-hover="images/User_sees_while_hovering_X1C_Middle.png"
           data-select="images/Selected_X1C_Middle.png"
           style="left:24%;top:20%;width:22%;height:60%;"></div>
      <div class="scene-hotspot" data-printer="x2d"
           data-hover="images/User_sees_while_hovering_X2D.png"
           data-select="images/Selected_X2D.png"
           style="left:45%;top:20%;width:20%;height:60%;"></div>
      <div class="scene-hotspot" data-printer="h2d"
           data-hover="images/User_sees_while_hovering_H2D.png"
           data-select="images/Selected_H2D.png"
           style="left:68%;top:10%;width:30%;height:78%;"></div>
      <div class="scene-selected-label" id="scene-label">Hover to preview · click to select</div>
    </div>
    <div class="printer-status-row" id="printers-grid"></div>
  </div>

  <div class="gantt-wrap">
    <div class="gantt-header">
      <div class="section-label" style="margin:0;">Schedule</div>
      <div style="display:flex;align-items:center;gap:6px;">
        <button class="gantt-nav-btn" id="cal-prev">&#8592;</button>
        <span class="gantt-title" id="cal-title"></span>
        <button class="gantt-nav-btn" id="cal-next">&#8594;</button>
      </div>
    </div>
    <div class="gantt-scroll-area" id="gantt-scroll">
      <div class="gantt-scroll-inner" id="gantt-inner"></div>
    </div>
  </div>
  <div class="gantt-tooltip" id="gantt-tooltip"></div>

  <div class="card">
    <h2>New reservation</h2>

    <div class="f-section">
      <span class="f-label">Your name</span>
      <div class="field">
        <input type="text" id="input-name" placeholder="e.g. Seb" autocomplete="off">
      </div>
    </div>

    <div class="f-section">
      <span class="f-label">Day</span>
      <div class="day-row" id="day-row"></div>
    </div>

    <div class="f-section">
      <div class="dur-custom-row">
        <div class="dur-section">
          <span class="f-label">Quick duration</span>
          <div class="dur-row" id="dur-row">
            <button class="dur-btn" data-h="0.25">15 min</button>
            <button class="dur-btn" data-h="0.5">30 min</button>
            <button class="dur-btn" data-h="0.75">45 min</button>
            <button class="dur-btn" data-h="1">1 h</button>
            <button class="dur-btn" data-h="1.5">1 h 30</button>
            <button class="dur-btn" data-h="2">2 h</button>
            <button class="dur-btn" data-h="2.5">2 h 30</button>
            <button class="dur-btn" data-h="3">3 h</button>
            <button class="dur-btn" data-h="overnight" data-overnight="true">Overnight</button>
          </div>
        </div>
        <div class="custom-section">
          <span class="f-label" style="color:var(--text-secondary);">Custom duration</span>
          <select id="input-custom-dur" style="font-size:14px;padding:8px 12px;border:1px solid var(--border-secondary);border-radius:var(--radius);background:var(--bg-secondary);color:var(--text);font-family:inherit;">
            <option value="">—</option>
          </select>
        </div>
      </div>
    </div>

    <div class="f-section">
      <div class="start-time-row">
        <label>Start time</label>
        <select id="input-start-time"></select>
        <span style="font-size:13px;color:var(--text-secondary);">→</span>
        <span id="input-end-time-display" style="font-size:14px;padding:8px 0;color:var(--text);font-weight:500;min-width:80px;">—</span>
        <span style="font-size:12px;color:var(--text-tertiary);" id="dur-display"></span>
        <select id="input-end-time" style="display:none;"></select>
      </div>
    </div>

    <div class="f-section">
      <span class="f-label">Notes (optional)</span>
      <div class="field">
        <textarea id="input-note" placeholder="e.g. Long structural print, don't interrupt"></textarea>
      </div>
    </div>

    <div class="conflict-msg" id="conflict-msg"><i class="ti ti-alert-triangle"></i> Conflict with an existing reservation on this printer.</div>
    <button class="btn-submit" id="btn-submit" disabled>Reserve printer</button>
  </div>

  <div class="webhook-bar" style="margin-top:2rem;opacity:0.6;">
    <i class="ti ti-brand-teams" style="font-size:18px;color:var(--text-secondary);flex-shrink:0;"></i>
    <input type="text" id="webhook-input" placeholder="Teams webhook URL…" autocomplete="off" spellcheck="false">
    <span class="webhook-status ws-none" id="webhook-status">Not configured</span>
    <button class="btn-test" id="btn-test" style="display:none;">Send test</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const PRINTERS = [
  { id: 'x1c-left',   name: 'X1C Left',   model: 'Bambu X1C' },
  { id: 'x1c-middle', name: 'X1C Middle',  model: 'Bambu X1C' },
  { id: 'x2d',        name: 'X2D',         model: 'Bambu X2D' },
  { id: 'h2d',        name: 'H2D',         model: 'Bambu H2D' },
];

const COLORS = ['color-2','color-1','color-0','color-3'];

async function postToTeams(title, facts = []) {
  const url = getWebhook();
  if (!url.startsWith('https://')) return false;
  const payload = {
    type: 'AdaptiveCard', '$schema': 'http://adaptivecards.io/schemas/adaptive-card.json', version: '1.2',
    body: [
      { type: 'TextBlock', text: title, weight: 'Bolder', size: 'Medium', wrap: true },
      ...(facts.length ? [{ type: 'FactSet', facts: facts.map(f => ({ title: f.name, value: f.value })) }] : [])
    ]
  };
  try {
    const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
    return res.ok || res.status === 202;
  } catch(e) { return false; }
}

function buildTimeOptions(selectEl, startHour = 0) {
  const current = selectEl.value; selectEl.innerHTML = '';
  for (let h = startHour; h < 24; h++) {
    for (let m of [0, 15, 30, 45]) {
      if (h === 0 && m === 0 && startHour === 0) continue;
      const val = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
      const o = document.createElement('option'); o.value = val; o.textContent = formatTimeLabel(h, m);
      selectEl.appendChild(o);
    }
  }
  if (current && [...selectEl.options].some(o => o.value === current)) selectEl.value = current;
}

function formatTimeLabel(h, m) {
  const ampm = h < 12 ? 'AM' : 'PM';
  const hh = h === 0 ? 12 : h > 12 ? h - 12 : h;
  return `${hh}:${String(m).padStart(2,'0')} ${ampm}`;
}

function buildCustomDurOptions() {
  const sel = document.getElementById('input-custom-dur');
  sel.innerHTML = '<option value="">—</option>';
  for (let m = 15; m <= 480; m += 15) {
    const h = Math.floor(m/60), mins = m%60;
    const label = h > 0 ? (mins > 0 ? `${h}h ${mins}min` : `${h}h`) : `${mins}min`;
    const o = document.createElement('option'); o.value = m/60; o.textContent = label;
    sel.appendChild(o);
  }
}
buildCustomDurOptions();

document.getElementById('input-custom-dur').addEventListener('change', function() {
  if (!this.value) { activeCustomDur = false; renderDurBtns(); validate(); return; }
  activeDur = null; activeCustomDur = true; renderDurBtns();
  const hours = parseFloat(this.value);
  const startTs = getStartTs(); if (!startTs) return;
  const endTs = startTs + hours * 3600000;
  const endD = new Date(endTs);
  const roundedM = Math.round(endD.getMinutes()/15)*15 % 60;
  const roundedH = endD.getHours() + (Math.round(endD.getMinutes()/15)*15 >= 60 ? 1 : 0);
  const endVal = `${String(roundedH%24).padStart(2,'0')}:${String(roundedM).padStart(2,'0')}`;
  const endSel = document.getElementById('input-end-time');
  buildTimeOptions(endSel, 0);
  if ([...endSel.options].some(o => o.value === endVal)) endSel.value = endVal;
  updateDurDisplay(); validate();
});

function updateDurDisplay() {
  const start = getStartTs(), end = getEndTs();
  const durEl = document.getElementById('dur-display');
  const endDisp = document.getElementById('input-end-time-display');
  if (start && end && end > start) {
    const mins = Math.round((end-start)/60000);
    const h = Math.floor(mins/60), m = mins%60;
    durEl.textContent = h > 0 ? (m > 0 ? `(${h}h ${m}min)` : `(${h}h)`) : `(${m}min)`;
    endDisp.textContent = fmtTime(end);
  } else { durEl.textContent = ''; endDisp.textContent = '—'; }
}

document.getElementById('input-start-time').addEventListener('change', () => {

      const roundedH = endD.getHours() + (Math.round(endD.getMinutes()/15)*15 >= 60 ? 1 : 0);
      const endVal = String(roundedH%24).padStart(2,'0') + ':' + String(roundedM).padStart(2,'0');
      const endSel = document.getElementById('input-end-time');
      buildTimeOptions(endSel, 0);

function getStartTs() {
  const d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate() + selectedDayOffset);
  const [h, m] = document.getElementById('input-start-time').value.split(':').map(Number);
  if (isNaN(h)) return null;
  d.setHours(h, m, 0, 0); return d.getTime();
}

function getEndTs() {
  const startTs = getStartTs(); if (!startTs) return null;
  const endVal = document.getElementById('input-end-time').value;
  const [eh, em] = endVal.split(':').map(Number); if (isNaN(eh)) return null;
  const endD = new Date(startTs); endD.setHours(eh, em, 0, 0);
  if (endD.getTime() <= startTs) endD.setDate(endD.getDate() + 1);
  return endD.getTime();
}

function now() { return Date.now(); }

function fmtTime(ts) { return new Date(ts).toLocaleTimeString('en-CA', { hour: '2-digit', minute: '2-digit' }); }

function fmtFull(ts) {
  const d = new Date(ts);
  const today = new Date(); today.setHours(0,0,0,0);
  const tom = new Date(today); tom.setDate(tom.getDate()+1);
  const dd = new Date(d); dd.setHours(0,0,0,0);
  const prefix = dd.getTime()===today.getTime()?'Today':dd.getTime()===tom.getTime()?'Tomorrow':d.toLocaleDateString('en-CA',{month:'short',day:'numeric'});
  return prefix + ' ' + fmtTime(ts);
}

function fmtDur(ms) {
  const h = Math.round(ms/360000)/10;
  return h >= 24 ? Math.round(h/24*10)/10 + ' days' : h + ' h';
}

const GANTT_START_H = 6, GANTT_END_H = 24;
const GANTT_HOURS = GANTT_END_H - GANTT_START_H;
const PX_PER_HOUR = 80;

function getDays() {
  const base = new Date(); base.setHours(0,0,0,0);
  base.setDate(base.getDate() + calWeekOffset * 3);
  return [0,1,2].map(i => { const d = new Date(base); d.setDate(base.getDate()+i); return d; });
}

function renderCalendar() {
  const days = getDays();
  const today = new Date(); today.setHours(0,0,0,0);
  const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const DAY_NAMES = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const n = now();
  const first = days[0], last = days[days.length-1];
  const titleEl = document.getElementById('cal-title');
  titleEl.textContent = calWeekOffset === 0 ? 'Next 3 days' : `${MONTHS[first.getMonth()]} ${first.getDate()} – ${last.getDate()}`;

  const inner = document.getElementById('gantt-inner');
  const trackWidth = GANTT_HOURS * PX_PER_HOUR * days.length;
  const labelW = 130;
  let dayCells = '', hourCells = '';

  days.forEach(day => {
    const isToday = day.getTime() === today.getTime();
    const dayLabel = isToday ? 'Today' : (DAY_NAMES[day.getDay()] + ' ' + day.getDate() + ' ' + MONTHS[day.getMonth()]);
    const dayWidth = GANTT_HOURS * PX_PER_HOUR;
    dayCells += `<div style="width:${dayWidth}px;flex-shrink:0;border-left:${isToday?'1.5px solid var(--border-info)':'0.5px solid var(--border)'};padding:4px 8px;font-size:11px;font-weight:700;color:${isToday?'var(--text-info)':'var(--text-secondary)'};background:${isToday?'var(--bg-info)':'var(--bg-secondary)'};white-space:nowrap;">${dayLabel}</div>`;
    for (let h = GANTT_START_H; h < GANTT_END_H; h++) {
      const label = h < 12 ? h+'am' : h === 12 ? '12pm' : (h-12)+'pm';
      hourCells += `<div class="gantt-hour" style="width:${PX_PER_HOUR}px;${h===GANTT_START_H?'border-left:1.5px solid var(--border-info);':''}">${label}</div>`;
    }
  });

  const colorBg = ['#edfaf1','#fef3e2','#e8f4fd','#fce8f3'];

  let rowsHtml = '';
  PRINTERS.forEach((p, pi) => {
    const color = COLORS[pi], borderColor = BORDER_COLORS[pi];
    let barsHtml = '', nowLineHtml = '';
    days.forEach((day, di) => {
      const dayStart = day.getTime(), dayEnd = dayStart + 86400000;
      const ganttStart = dayStart + GANTT_START_H * 3600000;
      const ganttEnd = dayStart + GANTT_END_H * 3600000;
      const dayOffsetPx = di * GANTT_HOURS * PX_PER_HOUR;
      if (n >= ganttStart && n <= ganttEnd) {
        const nowPx = ((n - ganttStart) / 3600000) * PX_PER_HOUR;
        nowLineHtml += `<div class="gantt-now-line" style="left:${dayOffsetPx + nowPx}px;"></div>`;
      }
      const dayRes = reservations.filter(r => r.printer === p.id && r.end > n && r.start < dayEnd && r.end > dayStart);
      dayRes.forEach(r => {
        const barStart = Math.max(r.start, ganttStart), barEnd = Math.min(r.end, ganttEnd);
        if (barEnd <= barStart) return;
        const leftPx = dayOffsetPx + ((barStart - ganttStart) / 3600000) * PX_PER_HOUR;
        const widthPx = Math.max(((barEnd - barStart) / 3600000) * PX_PER_HOUR, 4);
        barsHtml += `<div class="gantt-bar ${color}" style="left:${leftPx}px;width:${widthPx}px;border-left-color:${borderColor};"
          data-id="${r.id}" data-tip="${r.name} | ${p.name} | ${fmtTime(r.start)} – ${fmtTime(r.end)}${r.note ? ' | ' + r.note : ''}">
          <span class="gantt-bar-text">${r.name}</span>
          <span class="gantt-bar-sub">${fmtTime(r.start)}–${fmtTime(r.end)}</span>
        </div>`;
      });
    });
    rowsHtml += `<div class="gantt-row">
      <div class="gantt-row-label" style="background:${colorBg[pi]};border-left:4px solid ${borderColor};">${p.name}<span>${p.model}</span></div>
      <div class="gantt-row-track" style="width:${trackWidth}px;">
        <div class="gantt-track-bg" style="background-image:repeating-linear-gradient(90deg,transparent,transparent ${PX_PER_HOUR-0.5}px,var(--border) ${PX_PER_HOUR-0.5}px,var(--border) ${PX_PER_HOUR}px);"></div>
        ${nowLineHtml}${barsHtml}
      </div>
    </div>`;
  });

  let daySepLines = '';
  days.forEach((day, di) => {
    if (di === 0) return;
    daySepLines += `<div style="position:absolute;left:${labelW + di*GANTT_HOURS*PX_PER_HOUR}px;top:0;bottom:0;width:1.5px;background:var(--border-info);pointer-events:none;z-index:3;"></div>`;
  });

  inner.style.position = 'relative';
  inner.innerHTML = `
    <div style="display:flex;position:sticky;top:0;z-index:4;border-bottom:0.5px solid var(--border);">
      <div style="width:${labelW}px;flex-shrink:0;border-right:0.5px solid var(--border);background:var(--bg);"></div>
      <div style="display:flex;overflow:hidden;">${dayCells}</div>
    </div>
    <div style="display:flex;position:sticky;top:25px;z-index:4;background:var(--bg);border-bottom:0.5px solid var(--border);">
      <div style="width:${labelW}px;flex-shrink:0;border-right:0.5px solid var(--border);"></div>
      <div style="display:flex;overflow:hidden;position:relative;">${hourCells}</div>
    </div>
    <div style="position:relative;">${daySepLines}${rowsHtml}</div>
  `;

  const tooltip = document.getElementById('gantt-tooltip');
  inner.querySelectorAll('.gantt-bar').forEach(bar => {
    bar.addEventListener('mouseenter', e => {
      tooltip.innerHTML = bar.dataset.tip.split(' | ').map(s => `<div>${s}</div>`).join('') +
        `<div style="margin-top:6px;font-size:10px;opacity:0.7;">Click to cancel</div>`;
      tooltip.classList.add('show');
    });
    bar.addEventListener('mousemove', e => { tooltip.style.left = (e.clientX+14)+'px'; tooltip.style.top = (e.clientY-10)+'px'; });
    bar.addEventListener('mouseleave', () => tooltip.classList.remove('show'));
    bar.addEventListener('click', async () => {
      tooltip.classList.remove('show');
      const id = bar.dataset.id;
      const r = reservations.find(x => String(x.id) === String(id)); if (!r) return;
      if (!confirm(`Cancel this reservation for ${r.name}?`)) return;
      const p = PRINTERS.find(x => x.id === r.printer);
      reservations = reservations.filter(x => String(x.id) !== String(id));
      renderAll(); showToast('Reservation cancelled');
      try { await deleteFromSP(id); } catch(e) { console.error('SP delete error:', e); }
      await postToTeams('Reservation cancelled', [
        { name: 'Printer', value: p ? `${p.name} (${p.model})` : r.printer },
        { name: 'Was scheduled', value: `${fmtFull(r.start)} to ${fmtFull(r.end)}` },
        { name: 'Cancelled by', value: nameEl.value || '—' }
      ]);
    });
  });
}

document.getElementById('cal-prev').addEventListener('click', () => { calWeekOffset--; renderCalendar(); });
document.getElementById('cal-next').addEventListener('click', () => { calWeekOffset++; renderCalendar(); });

function getStatus(pid) {
  const n = now();
  if (reservations.find(r=>r.printer===pid&&r.start<=n&&r.end>=n)) return 'busy';
  if (reservations.find(r=>r.printer===pid&&r.start>n)) return 'reserved';
  return 'free';
}

function hasConflict(pid, start, end) {
  return reservations.some(r => r.printer===pid && r.start<end && r.end>start);
}

function renderPrinters() {
  const grid = document.getElementById('printers-grid'); grid.innerHTML = '';
  PRINTERS.forEach((p, colorIdx) => {
    const card = document.createElement('div');
    card.className = 'psr-card' + (selectedPrinter === p.id ? ' selected' : '');
    card.style.cssText = `border-left: 4px solid ${BORDER_COLORS[colorIdx]};`;
    card.innerHTML = `<i class="ti ti-check psr-check"></i><div class="psr-name">${p.name}</div><div class="psr-model">${p.model}</div>`;
    card.addEventListener('click', () => { selectedPrinter = p.id; renderPrinters(); validate(); });
    grid.appendChild(card);
  });
  syncSceneToSelection();
  initHotspots();
}

function syncSceneToSelection() {
  const img = document.getElementById('scene-img');
  const label = document.getElementById('scene-label');
  if (!img) return;
  document.querySelectorAll('.scene-printer-name').forEach(el => el.remove());
  if (!selectedPrinter) {
    img.src = img.dataset.scene;
    if (label) label.textContent = 'Hover to preview · click to select';
    return;
  }
  const hs = document.querySelector(`.scene-hotspot[data-printer="${selectedPrinter}"]`);
  if (hs) img.src = hs.dataset.select;
  if (label) label.style.display = 'none';
  const p = PRINTERS.find(x => x.id === selectedPrinter);
  const colorIdx = PRINTERS.indexOf(p);
  const color = BORDER_COLORS[colorIdx];
  if (hs && p) {
    const hsLeft = parseFloat(hs.style.left);
    const hsWidth = parseFloat(hs.style.width);
    const hsTop = parseFloat(hs.style.top);
    const bubble = document.createElement('div');
    bubble.className = 'scene-printer-name';
    bubble.textContent = p.name;
    bubble.style.cssText = `position:absolute;left:${hsLeft+hsWidth/2}%;top:calc(${hsTop}% - 2px);transform:translate(-50%,-100%);background:${color};color:#fff;font-size:12px;font-weight:700;padding:3px 12px;border-radius:20px;pointer-events:none;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,0.35);z-index:10;`;
    hs.parentElement.appendChild(bubble);
  }
}

let _hotspotsInited = false;
function initHotspots() {
  if (_hotspotsInited) return;
  _hotspotsInited = true;
  const img = document.getElementById('scene-img'); if (!img) return;
  document.querySelectorAll('.scene-hotspot').forEach(hs => {
    const pid = hs.dataset.printer;
    hs.addEventListener('mouseenter', () => {
      if (selectedPrinter !== pid) {
        img.src = hs.dataset.hover;
        const lbl = document.getElementById('scene-label');
        if (lbl) { lbl.style.display = ''; lbl.textContent = PRINTERS.find(x=>x.id===pid)?.name || pid; }
      }
    });
    hs.addEventListener('mouseleave', () => {
      const lbl = document.getElementById('scene-label');
      if (!selectedPrinter) {
        img.src = img.dataset.scene;
        if (lbl) { lbl.style.display = ''; lbl.textContent = 'Hover to preview · click to select'; }
        return;
      }
      const selHs = document.querySelector(`.scene-hotspot[data-printer="${selectedPrinter}"]`);
      img.src = selHs ? selHs.dataset.select : img.dataset.scene;
      if (lbl) lbl.style.display = 'none';
    });
    hs.addEventListener('click', () => { selectedPrinter = pid; renderPrinters(); validate(); });
  });
}

function renderAll() { renderPrinters(); renderCalendar(); }

function validate() {
  const name = nameEl.value.trim(), pid = selectedPrinter;
  const start = getStartTs(), end = getEndTs();
  const ok = name && pid && start && end && end > start;
  const conflict = ok && hasConflict(pid, start, end);
  document.getElementById('conflict-msg').classList.toggle('show', conflict && !!ok);
  document.getElementById('btn-submit').disabled = !ok || conflict;
}

nameEl.addEventListener('input', validate);

function renderDurBtns() {
  document.querySelectorAll('.dur-btn').forEach(b => b.classList.toggle('active', b.dataset.overnight ? activeDur === 'overnight' : b.dataset.h == activeDur));
  const customSel = document.getElementById('input-custom-dur');
  if (customSel) {
    customSel.style.background = activeCustomDur ? 'var(--bg-info)' : 'var(--bg-secondary)';
    customSel.style.color = activeCustomDur ? 'var(--text-info)' : 'var(--text)';
    customSel.style.borderColor = activeCustomDur ? 'var(--border-info)' : 'var(--border-secondary)';
  }
}

document.getElementById('dur-row').addEventListener('click', e => {
  const btn = e.target.closest('.dur-btn'); if (!btn) return;
  const startSel = document.getElementById('input-start-time');
  const endSel = document.getElementById('input-end-time');
  if (btn.dataset.overnight) {
    activeDur = 'overnight'; activeCustomDur = false;
    document.getElementById('input-custom-dur').value = '';
    renderDurBtns();
    buildTimeOptions(startSel); startSel.value = '17:00';
    buildTimeOptions(endSel, 0); endSel.value = '08:00';
    updateDurDisplay(); validate(); return;
  }
  const hours = parseFloat(btn.dataset.h);
  activeDur = hours; activeCustomDur = false;
  document.getElementById('input-custom-dur').value = '';
  renderDurBtns();
  const startTs = getStartTs(); if (!startTs) return;
  const endTs = startTs + hours * 3600000;
  const endD = new Date(endTs);
  const roundedM = Math.round(endD.getMinutes()/15)*15 % 60;
  const roundedH = endD.getHours() + (Math.round(endD.getMinutes()/15)*15 >= 60 ? 1 : 0);
  const endVal = `${String(roundedH%24).padStart(2,'0')}:${String(roundedM).padStart(2,'0')}`;
  buildTimeOptions(endSel, 0);
  if ([...endSel.options].some(o => o.value === endVal)) endSel.value = endVal;
  updateDurDisplay(); validate();
});

document.getElementById('btn-submit').addEventListener('click', async () => {
  const name = nameEl.value.trim(), pid = selectedPrinter;
  const start = getStartTs(), end = getEndTs();
  const note = document.getElementById('input-note').value.trim();
  if (!name||!pid||!start||!end||end<=start||hasConflict(pid,start,end)) return;
  const p = PRINTERS.find(x => x.id===pid);
  const overnight = (end - start) >= 43200000;
  const newRes = { id: Date.now(), name, printer: pid, start, end, note };
  reservations.push(newRes);
  document.getElementById('input-note').value = '';
  activeDur = null; activeCustomDur = false; renderDurBtns();
  document.getElementById('input-custom-dur').value = '';
  selectedPrinter = null;
  setDefaultTimes(); validate(); renderAll();
  const sceneImg = document.getElementById('scene-img');
  if (sceneImg) sceneImg.src = sceneImg.dataset.scene;
  const sceneLabel = document.getElementById('scene-label');
  if (sceneLabel) { sceneLabel.style.display = ''; sceneLabel.textContent = 'Hover to preview · click to select'; }
  document.querySelectorAll('.scene-printer-name').forEach(el => el.remove());
  _hotspotsInited = false;
  try { const spId = await saveToSP(newRes); newRes.id = spId; }
  catch(e) { console.error('SP save error:', e); showError('Could not save: ' + e.message); }
  await postToTeams(`${overnight ? 'Long print' : 'Print'} reserved — ${p ? p.name : pid}`, [
    { name: 'Printer', value: p ? `${p.name} (${p.model})` : pid },
    { name: 'Reserved by', value: name },
    { name: 'Start', value: fmtFull(start) },
    { name: 'End', value: fmtFull(end) },
    { name: 'Duration', value: fmtDur(end - start) },
    ...(note ? [{ name: 'Notes', value: note }] : [])
  ]);
});

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

// ── Init ──────────────────────────────────────────────────────────────────
renderAll();
validate();
loadReservations();
loadWebhookFromSupabase();
setInterval(loadReservations, 30000);
</script>
</body>
</html>
